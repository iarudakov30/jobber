<section class="card narrow">
  <h1>Sign in</h1>

  <form [formRoot]="loginForm">
    <label class="field">
      <span>Email</span>
      <input type="email" [formField]="loginForm.email" autocomplete="email" />
      <app-field-errors [field]="loginForm.email" />
    </label>

    <label class="field">
      <span>Password</span>
      <input
        type="password"
        [formField]="loginForm.password"
        autocomplete="current-password"
      />
      <app-field-errors [field]="loginForm.password" />
    </label>

    <app-form-errors [form]="loginForm" />

    <button
      class="btn primary"
      type="submit"
      [disabled]="loginForm().submitting()"
    >
      {{ loginForm().submitting() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>

  <p class="muted">No account yet? <a routerLink="/register">Create one</a></p>
</section>
