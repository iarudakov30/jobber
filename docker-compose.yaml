services:
  postgres:
    image: postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_PASSWORD: example
    volumes:
      - postgres_data:/var/lib/postgresql

  pulsar:
    image: apachepulsar/pulsar
    # apply-config-from-env.py copies matching environment variables into standalone.conf.
    command: >
      sh -c "bin/apply-config-from-env.py conf/standalone.conf && bin/pulsar standalone"
    environment:
      # Drops a resent message whose producer name + sequenceId it has already seen, which is
      # how the outbox relay's resends after a crash are deduplicated.
      brokerDeduplicationEnabled: 'true'
    ports:
      - '6650:6650'
    volumes:
      - pulsar_data:/pulsar/data

  # Commands, delayed commands and email (NexusPay phase 3). Management UI at
  # http://localhost:15672 (guest / guest).
  rabbitmq:
    image: rabbitmq:4-management
    # RabbitMQ names its data directory after the host name; a fixed one keeps the data when
    # compose recreates the container.
    hostname: rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # Idempotency fast path for the wallet; later rate limits and quotes.
  redis:
    image: redis:7
    ports:
      - '6379:6379'

  # Catches outgoing email (SMTP on 1025); UI at http://localhost:8025.
  mailpit:
    image: axllent/mailpit
    ports:
      - '1025:1025'
      - '8025:8025'

  # Receives OpenTelemetry traces over OTLP/HTTP on 4318; UI at http://localhost:16686.
  jaeger:
    image: jaegertracing/jaeger
    ports:
      - '4318:4318'
      - '16686:16686'

volumes:
  postgres_data:
  pulsar_data:
  rabbitmq_data:
