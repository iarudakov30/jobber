syntax = "proto3";

package auth;

service AuthService {
  rpc Authenticate(AuthenticateRequest) returns (User);
  // For other services (wallet transfers by email). NOT_FOUND when no user has that email.
  rpc FindUserByEmail(FindUserByEmailRequest) returns (User);
  // For other services (the email worker looks up the address). NOT_FOUND when no user has that id.
  rpc GetUser(GetUserRequest) returns (User);
}

message AuthenticateRequest {
  string token = 1;
}

message FindUserByEmailRequest {
  string email = 1;
}

message GetUserRequest {
  int32 id = 1;
}

message User {
  int32 id = 1;
  string email = 2;
}
