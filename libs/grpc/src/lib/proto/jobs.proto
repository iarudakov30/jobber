syntax = "proto3";

package jobs;

service JobsService {
  rpc Acknowledge(AcknowledgeRequest) returns (AcknowledgeResponse);
}

message AcknowledgeRequest {
  int32 jobId = 1;
  // Position of the item in the job; acknowledging the same index twice counts once.
  int32 index = 2;
}

message AcknowledgeResponse {}
